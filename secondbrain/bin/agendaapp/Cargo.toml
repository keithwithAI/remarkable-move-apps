[package]
name = "agendaapp"
edition.workspace = true
version.workspace = true
license.workspace = true

# The interactive planner: merged calendar+task day view with tap-to-complete and
# quick-pick defer. Launched from the AppLoad launcher (external app, qtfb framebuffer).
# On the Mac it runs as a minifb window (`--sim`) or headless (`--frames-dir`).
[[bin]]
name = "agendaapp"
path = "src/main.rs"

[dependencies]
sb-core = { path = "../../crates/core" }
sources = { path = "../../crates/sources" }
render = { path = "../../crates/render" }
ui = { path = "../../crates/ui" }
actionqueue = { path = "../../crates/actionqueue" }
qtfb = { path = "../../crates/qtfb" }
image.workspace = true
chrono.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
# evdev touch reader uses libc syscalls; kept general (not linux-only) so its pure parser + tests
# also compile/run on the Mac host. The syscall paths are only ever exercised on the device.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
minifb = "0.27"
